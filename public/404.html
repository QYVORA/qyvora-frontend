<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>404 - Node Not Found | QYVORA</title>
    <style>
      :root { --accent: #06b66f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card { text-align: left; max-width: 520px; width: 100%; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
      h1 { font-size: clamp(28px, 6vw, 44px); line-height: 1.1; letter-spacing: -0.02em; text-transform: uppercase; margin-bottom: 12px; }
      p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
      a {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--accent); color: #000;
        font-size: 11px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase;
        text-decoration: none; padding: 14px 32px; border-radius: 12px;
      }
      a:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">// 404 — NODE NOT FOUND</div>
      <h1>Lost in the Network?</h1>
      <p>The page you are looking for does not exist or has been moved.</p>
      <a href="/">Return to Base</a>
    </div>
  </body>
</html>
