<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>QYVORA</title>
  <defs>
    <!-- Brand canvas: pure black. The preview is the mark alone on the terminal canvas. -->
    <filter id="mark-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B66F;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#06B66F;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000" />

  <!-- Faint accent grid: terminal-born texture, barely there -->
  <g opacity="0.05" stroke="#06B66F" stroke-width="0.5" fill="none">
    <line x1="0" y1="0" x2="0" y2="630" /><line x1="60" y1="0" x2="60" y2="630" />
    <line x1="120" y1="0" x2="120" y2="630" /><line x1="180" y1="0" x2="180" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" /><line x1="300" y1="0" x2="300" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" /><line x1="420" y1="0" x2="420" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" /><line x1="540" y1="0" x2="540" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" /><line x1="660" y1="0" x2="660" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" /><line x1="780" y1="0" x2="780" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" /><line x1="1020" y1="0" x2="1020" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" /><line x1="1140" y1="0" x2="1140" y2="630" />
    <line x1="1200" y1="0" x2="1200" y2="630" />
    <line x1="0" y1="0" x2="1200" y2="0" /><line x1="0" y1="63" x2="1200" y2="63" />
    <line x1="0" y1="126" x2="1200" y2="126" /><line x1="0" y1="189" x2="1200" y2="189" />
    <line x1="0" y1="252" x2="1200" y2="252" /><line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="378" x2="1200" y2="378" /><line x1="0" y1="441" x2="1200" y2="441" />
    <line x1="0" y1="504" x2="1200" y2="504" /><line x1="0" y1="567" x2="1200" y2="567" />
  </g>

  <!-- Circuit traces, kept off the mark -->
  <g stroke="#06B66F" stroke-width="1" fill="none" opacity="0.14">
    <path d="M0,180 L72,180 L72,140 L110,140" />
    <circle cx="110" cy="140" r="3" fill="#06B66F" />
    <path d="M0,470 L64,470 L64,506 L104,506" />
    <circle cx="104" cy="506" r="3" fill="#06B66F" />
    <path d="M1200,170 L1128,170 L1128,210 L1092,210" />
    <circle cx="1092" cy="210" r="3" fill="#06B66F" />
    <path d="M1200,452 L1136,452 L1136,418 L1098,418" />
    <circle cx="1098" cy="418" r="3" fill="#06B66F" />
  </g>

  <!-- Glow pool under the mark so it sits on the canvas instead of floating -->
  <ellipse cx="600" cy="470" rx="210" ry="70" fill="url(#floor)" />

  <!-- QYVORA mark only — no wordmark, no tagline -->
  <g transform="translate(428.7 190.05) scale(0.49)" filter="url(#mark-glow)">
    <g transform="translate(0,510) scale(0.1,-0.1)" fill="#06B66F" stroke="none">
      <path d="M2380 4529 c-130 -14 -256 -37 -355 -66 -546 -158 -958 -539 -1125 -1042 -77 -231 -75 -205 -75 -966 0 -615 2 -689 18 -773 56 -288 181 -515 407 -743 249 -250 548 -410 912 -486 l133 -28 1315 -3 1315 -3 -30 30 c-16 16 -84 78 -150 137 -200 181 -773 703 -868 792 l-88 82 -560 0 c-471 0 -572 3 -636 16 -266 55 -457 221 -540 469 l-27 80 -4 435 c-2 280 0 456 7 496 27 152 80 252 192 365 61 61 95 86 170 123 160 79 138 77 1003 74 849 -4 793 1 941 -76 102 -53 230 -183 278 -282 66 -136 69 -166 73 -625 1 -225 3 -413 3 -416 1 -6 958 -692 1023 -734 l28 -17 21 48 c35 81 77 209 96 296 16 76 18 141 18 733 0 588 -2 659 -18 740 -75 372 -238 681 -484 916 -265 254 -587 395 -978 428 -146 13 -1891 12 -2015 0z" />
      <path d="M3062 2311 c2 -5 44 -47 95 -92 50 -46 304 -280 565 -520 260 -239 529 -487 598 -549 226 -206 343 -313 480 -440 205 -189 541 -494 578 -525 30 -25 36 -26 60 -16 62 28 928 496 949 513 8 7 -93 88 -350 281 -1296 970 -1555 1165 -1669 1256 l-127 101 -591 0 c-345 0 -590 -4 -588 -9z" />
    </g>
  </g>

  <!-- Corner brackets -->
  <g stroke="#06B66F" stroke-width="2" fill="none" opacity="0.28">
    <polyline points="20,40 20,20 40,20" />
    <polyline points="1160,20 1180,20 1180,40" />
    <polyline points="1180,590 1180,610 1160,610" />
    <polyline points="40,610 20,610 20,590" />
  </g>
</svg>