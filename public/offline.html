<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#06b66f" />
    <title>Offline - Connection Lost | QYVORA</title>
    <style>
      :root { --accent: #06b66f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #000000;
        color: #e5e5e5;
        font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card { text-align: left; max-width: 520px; width: 100%; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
      h1 { font-size: clamp(28px, 6vw, 44px); line-height: 1.1; letter-spacing: -0.02em; text-transform: uppercase; margin-bottom: 12px; }
      p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
      .log {
        border: 1px solid #1f1f1f;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 12px;
        line-height: 1.8;
        color: #6b7280;
        margin-bottom: 24px;
        overflow-x: auto;
        white-space: pre;
      }
      .log b { color: var(--accent); font-weight: 700; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      a, button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--accent);
        color: #000;
        font-family: inherit;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-decoration: none;
        padding: 14px 32px;
        border-radius: 12px;
        border: 0;
        cursor: pointer;
      }
      a:hover, button:hover { filter: brightness(1.1); }
      a.ghost { background: transparent; color: #e5e5e5; border: 1px solid #1f1f1f; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">// OFFLINE - CONNECTION LOST</div>
      <h1>Signal Dropped</h1>
      <p>You are offline and this page was never cached. Cached rooms, courses and the terminal simulator still work — rejoin the network to sync your progress.</p>
      <div class="log"><b>$</b> ping qyvora.org
no route to host
<b>$</b> <span id="cursor">_</span></div>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Retry</button>
        <a class="ghost" href="/">Return to Base</a>
      </div>
    </div>
  </body>
</html>
