<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Disable iOS color adjustment -->
    <meta name="format-detection" content="telephone=no" />
    <style>
      /* Critical CSS to prevent color shifts before main CSS loads */
      :root {
        --color-accent: #06B66F;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        color-adjust: exact;
      }
    </style>

    <!-- Theme bootstrap: applies the theme before the first paint so the page
         never flashes the wrong one. External, not inline, so it runs under the
         deployed CSP (script-src 'self'). Reads the same 'qyvora_theme' key as
         ThemeContext ('dark'|'light'|'system'). Source: public/theme-init.js -->
    <script src="/theme-init.js"></script>

    <!-- Per-route title, description, canonical, OG, and Twitter tags are injected
         by the prerender script (src/prerender.tsx) during the build, and managed
         client-side by the SEO component for non-prerendered routes. -->
    <meta name="theme-color" content="#06B66F" />
    <meta property="og:locale" content="en_US" />

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="author" href="/humans.txt" />
    <link rel="shortcut icon" href="/favicon.webp" />

    <!-- PWA (installable, offline-capable) -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="mask-icon" href="/favicon.webp" color="#06B66F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QYVORA" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    <meta name="msapplication-TileColor" content="#06B66F" />

    <!-- Performance: resource hints -->
    <link rel="preconnect" href="https://chat.whatsapp.com" />
    <link rel="preload" href="/fonts/jetbrains-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
    <script type="module" src="/src/prerender.tsx" prerender></script>
  </body>
</html>
